f1_imu_bridge:
  ros__parameters:
    endpoint: tcp://127.0.0.1:5555
    output_topic: /f1/imu/data_raw
    diagnostics_topic: /f1/imu/diagnostics
    frame_id: imu_link
    # Defaults assume the existing F1 protocol uses m/s^2 and rad/s.
    # Confirm against the flashed firmware and a stationary measurement.
    # If needed: g -> m/s^2: 9.80665; deg/s -> rad/s: 0.017453292519943295.
    acceleration_scale: 1.0
    angular_velocity_scale: 1.0
    # Status bit meanings are not present in this checkout. Zero checks no bits.
    # Set a required mask only after inspecting the actual firmware/protocol.
    required_status_mask: 0
    max_age_sec: 0.5
    clock_jump_sec: 0.1
