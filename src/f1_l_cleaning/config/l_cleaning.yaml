l_controller:
  ros__parameters:
    output_enabled: false
    edge_task_enabled: true
    # Shoot base_link +y at finite task walls; approach using pose feedback.
    # specified/default_edge_id or set_edge explicitly overrides ray selection.
    start_policy: left_ray
    use_map_tf: true
    require_localization_ready: true
    localization_status_max_age_sec: 0.60
    map_frame: map
    base_frame: base_link
    # Map-derived directed open wall chain; any number of left/right turns.
    # Chain 0 is the longest connected chain. Other chains are independent;
    # inspect map_profile --json before selecting another index.
    # route_xy may override a successfully derived chain with [x0,y0,...].
    route_chain_index: 0
    default_edge_id: edge_0
    wall_target_m: 0.33
    side_on_distance_m: 0.35
    side_off_distance_m: 0.31
    hull_half_length_m: 0.25
    hull_half_width_m: 0.225
    brush_x_m: 0.10
    brush_tip_y_m: 0.33
    brush_compression_m: 0.01
    edge_select_max_distance_m: 0.85
    edge_heading_tolerance_rad: 1.2217304763960306
    edge_target_distance_tolerance_m: 0.20
    edge_target_angle_tolerance_rad: 1.2217304763960306
    edge_progress_jump_m: 0.35
    corner_exclusion_m: 0.30
    endpoint_margin_m: 0.30
    front_stop_m: 0.30
    # Reuse simultaneous reverse + right push, then feedback-based right turn.
    transfer_move_duration_sec: 0.50
    transfer_side_percent: 50.0
    transfer_timeout_sec: 0.0
    transfer_turn_timeout_sec: 0.0
    transfer_turn_tolerance_rad: 0.3490658503988659
    # Left turn: forward beyond endpoint, left shift to next entry, left turn.
    # Motion targets only; no hull/adjacent-corner clearance checks.
    left_exit_forward_m: 0.35
    left_transfer_position_tolerance_m: 0.05
    fifth_left_sign: 1
    # Fifth-thruster magnitude for wall following and initial approach.
    side_percent: 50.0
    brush_percent: 50.0
    heading_deadband_rad: 0.17453292519943295
    heading_correction_deadband_rad: 0.05235987755982989
    turn_speed_percent: 25
    run_timeout_sec: 0.0
    wall_recovery_sec: 1.5
