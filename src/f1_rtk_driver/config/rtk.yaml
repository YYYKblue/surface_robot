/f1/rtk/rtk_driver:
  ros__parameters:
    port: auto
    baudrate: 115200
    # ROS status heartbeat; configure the GGA period on the receiver.
    status_rate_hz: 20.0
    stale_timeout_sec: 1.5
    reconnect_sec: 1.0
    # Optional private JSON via F1_RTK_NTRIP_CONFIG, or ntrip_config_file parameter.
    # Leave unset to preserve the environment-file selection; never put credentials here.
    antenna_frame: gnss_ant1
