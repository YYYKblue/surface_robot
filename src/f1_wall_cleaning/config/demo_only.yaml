# SYNTHETIC GEOMETRY ONLY. These are not measurements of the user's robot.
/**:
  ros__parameters:
    geometry_confirmed: true
    hull_length_m: 0.8
    hull_width_m: 0.6
    brush_x_m: 0.0
    brush_tip_y_m: 0.5
    brush_compression_m: 0.02
    brush_max_compression_m: 0.04
    stopping_distance_m: 0.25
    front_slow_distance_m: 0.8
    pulse_response_calibrated: false
    # Avoid making replay look like an unbounded complete cleaning mission.
    max_run_sec: 60.0
