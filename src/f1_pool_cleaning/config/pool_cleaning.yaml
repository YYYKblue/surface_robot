pool_controller:
  ros__parameters:
    output_enabled: false
    edge_task_enabled: true
    # Consume fresh map -> base_link TF from fixed-map localization.
    # Set false when supplying PoseWithCovarianceStamped on map_pose instead.
    use_map_tf: true
    # Stage 1 gate: a task cannot start until the localization manager reports
    # a stable RViz-initialized map -> base_link pose.
    require_localization_ready: true
    localization_status_max_age_sec: 0.60
    map_frame: map
    base_frame: base_link
    # Map geometry (origin/axis/length/width and the boundary route) is not
    # configured here: the launch derives it from map:=<pbstream or map yaml>
    # and passes it in, so changing maps only means changing the map path.
    # Confirmed stable left-brush band: centre-to-wall distance 32--36 cm.
    wall_target_m: 0.34
    # Fifth thruster: left above 36 cm, right below 32 cm, neutral in between.
    side_on_distance_m: 0.36
    side_off_distance_m: 0.32
    # Confirmed enclosing hull is 50 cm long by 45 cm wide.
    hull_half_length_m: 0.25
    hull_half_width_m: 0.225
    brush_x_m: 0.10
    brush_tip_y_m: 0.33
    brush_compression_m: 0.01
    # Allow rough placement up to 85 cm from the selected left-side wall.
    edge_select_max_distance_m: 0.85
    # Initial wall association may be up to 70 degrees off; heading is
    # corrected before the brush gate opens.
    edge_heading_tolerance_rad: 1.2217304763960306
    edge_progress_jump_m: 0.35
    corner_exclusion_m: 0.30
    endpoint_margin_m: 0.30
    # The map-derived boundary is always generated in the canonical clockwise
    # route, so all four edges keep the single brush on the boat's left.
    boundary_order: clockwise
    # Always start from the first long edge. The pose must still be near edge_0
    # and the wall must remain on base_link +y; completed edges advance in order.
    default_edge_id: "edge_0"
    # Wider than the 32--36 cm control band: map edge identity must survive
    # rough initial placement before the fifth thruster closes the gap.
    edge_target_distance_tolerance_m: 0.20
    # Permit the same rough heading error used by map edge selection; the
    # local wall fit still rejects unrelated perpendicular corner walls.
    edge_target_angle_tolerance_rad: 1.2217304763960306
    # Common endpoint trigger for all four edges: boat centre to front wall.
    front_stop_m: 0.30
    # Reverse and right-side push are issued together for 0.5 s before each
    # 90-degree right turn.  These values are bounded motion parameters, not
    # a substitute for turn-angle feedback.
    transfer_move_duration_sec: 0.50
    # A rough heading is sufficient; APPROACH_NEXT_EDGE performs final
    # wall-based heading correction. Zero disables both transfer timeouts.
    transfer_timeout_sec: 0.0
    transfer_turn_timeout_sec: 0.0
    transfer_turn_tolerance_rad: 0.3490658503988659
    # User confirmed positive -> left, 2026-10-23.
    fifth_left_sign: 1
    side_percent: 30.0
    brush_percent: 30.0
    # Brush gate: +/-10 degrees, inclusive, independently of yaw correction.
    heading_deadband_rad: 0.17453292519943295
    # Correct yaw while the brush is running; do not wait for +/-10 degrees.
    heading_correction_deadband_rad: 0.05235987755982989
    turn_speed_percent: 25
    run_timeout_sec: 0.0
    # Fresh invalid wall fits: neutral outputs, recover automatically up to 1.5 s.
    wall_recovery_sec: 1.5
